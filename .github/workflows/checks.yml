name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Install the Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Test
        run: pnpm test
      - name: Keep the traces of any failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: |
            test-results
            .lighthouseci
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: true

  pages-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STATIC_EXPORT: "true"
      PAGES_BASE_PATH: ""
      NEXT_PUBLIC_SITE_URL: https://www.jvmsolutions.net
      NEXT_PUBLIC_NOINDEX: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Remove the API from the static build
        run: rm -rf app/api
      - name: Build the production Pages export
        run: pnpm build && node scripts/pages-postbuild.mjs out && node scripts/verify-pages.mjs out
      - name: Lighthouse on Pages export, mobile
        run: pnpm exec lhci collect --startServerCommand="node scripts/serve-pages.mjs out 3200" && pnpm exec lhci assert
      - name: Lighthouse on Pages export, desktop
        run: pnpm exec lhci collect --startServerCommand="node scripts/serve-pages.mjs out 3200" --settings.preset=desktop && pnpm exec lhci assert
      - name: Retain performance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-lighthouse-reports
          path: .lighthouseci
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
